[package]
name = "rshogi-usi"
version = "0.1.0"
edition = "2024"
authors = ["SH11235"]
description = "USI protocol implementation for rshogi engine"
license = "GPL-3.0-or-later"
repository = "https://github.com/sh11235/rshogi"
keywords = ["shogi", "usi", "japanese-chess", "engine", "protocol"]
categories = ["games", "game-engines"]
readme = "README.md"

[dependencies]
# Workspace dependencies
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true

# Local dependencies
# rshogi-core の default features は本 crate の default で明示的に再構築する
# (preset edition specific build 時に複数 edition が unify されるのを防ぐため)。
rshogi-core = { version = "0.5", path = "../rshogi-core", default-features = false }
# 定跡(opening book)リーダ + probe。edition を持ち込まないよう default-features=false。
rshogi-book = { version = "0.1", path = "../rshogi-book", default-features = false }

[features]
# default は rshogi-core 側 default (search-no-pass-rules + edition-universal) と一致させる。
default = ["search-no-pass-rules", "edition-universal"]
# 探索統計収集（枝刈り発生回数等のカウント）
search-stats = ["rshogi-core/search-stats"]
# NNUE統計収集（refresh/update比率等のカウント）
nnue-stats = ["rshogi-core/nnue-stats"]
# TT書き込みトレースおよびhelper bound/depthフィルタ
tt-trace = ["rshogi-core/tt-trace"]
# NNUE 詳細診断ログ（Golden Forward テスト用）
diagnostics = ["rshogi-core/diagnostics"]
# Threat exclusion profiles
threat-profile-same-class = ["rshogi-core/threat-profile-same-class"]
threat-profile-same-class-major-pawn = ["rshogi-core/threat-profile-same-class-major-pawn"]
threat-profile-step-attacker = ["rshogi-core/threat-profile-step-attacker"]
threat-profile-full-symdedup = ["rshogi-core/threat-profile-full-symdedup"]
threat-profile-cross-side = ["rshogi-core/threat-profile-cross-side"]
# NNUE progress8kpabs 差分更新最適化（L0=1536 系 / L0=3072 で有効、L0=768/512 で退行）
nnue-progress-diff = ["rshogi-core/nnue-progress-diff"]
# 探索経路限定で pass_rights を無効化
search-no-pass-rules = ["rshogi-core/search-no-pass-rules"]

# === Edition 軸 atomic feature 群 ===
# 設計は docs/decisions/2026-05-24-build-edition-flavor-design.md を参照。
# Architecture 経路
layerstack-arch     = ["rshogi-core/layerstack-arch"]
halfkx-arch = ["rshogi-core/halfkx-arch"]
# LS L1 サイズ slot
layerstacks-1536x16x32 = ["rshogi-core/layerstacks-1536x16x32"]
layerstacks-1536x32x32 = ["rshogi-core/layerstacks-1536x32x32"]
layerstacks-768x16x32  = ["rshogi-core/layerstacks-768x16x32"]
layerstacks-768x8x32   = ["rshogi-core/layerstacks-768x8x32"]
layerstacks-512x16x32  = ["rshogi-core/layerstacks-512x16x32"]
layerstacks-1024x16x32 = ["rshogi-core/layerstacks-1024x16x32"]
layerstacks-3072x16x32 = ["rshogi-core/layerstacks-3072x16x32"]
# LS 拡張 slot
nnue-psqt   = ["rshogi-core/nnue-psqt"]
nnue-threat = ["rshogi-core/nnue-threat"]
nnue-effect-bucket = ["rshogi-core/nnue-effect-bucket"]
effect-bucket-2x2-kingfixed = ["rshogi-core/effect-bucket-2x2-kingfixed"]
effect-bucket-2x2-kingbucketed = ["rshogi-core/effect-bucket-2x2-kingbucketed"]
effect-bucket-3x3-kingfixed = ["rshogi-core/effect-bucket-3x3-kingfixed"]
effect-bucket-3x3-kingbucketed = ["rshogi-core/effect-bucket-3x3-kingbucketed"]
# FT 種別 slot
ft-halfkp           = ["rshogi-core/ft-halfkp"]
ft-halfka_split     = ["rshogi-core/ft-halfka_split"]
ft-halfka_merged    = ["rshogi-core/ft-halfka_merged"]
ft-halfka_hm_split  = ["rshogi-core/ft-halfka_hm_split"]
ft-halfka_hm_merged = ["rshogi-core/ft-halfka_hm_merged"]
# HalfKX activation slot
halfkx-activation-crelu    = ["rshogi-core/halfkx-activation-crelu"]
halfkx-activation-screlu   = ["rshogi-core/halfkx-activation-screlu"]
halfkx-activation-pairwise = ["rshogi-core/halfkx-activation-pairwise"]
# Build mode sentinel (preset edition がセット、build.rs 整合性チェック用)
mode-universal = ["rshogi-core/mode-universal"]
mode-family    = ["rshogi-core/mode-family"]
mode-specific  = ["rshogi-core/mode-specific"]

# === preset edition (user-facing canonical API) ===
# 各 preset は rshogi-core 側の同名 preset へ forward する。
edition-universal = ["rshogi-core/edition-universal"]
edition-halfkx     = ["rshogi-core/edition-halfkx"]
edition-halfkx-any = ["rshogi-core/edition-halfkx-any"]
edition-layerstacks             = ["rshogi-core/edition-layerstacks"]
edition-layerstacks-any-any-any = ["rshogi-core/edition-layerstacks-any-any-any"]
edition-halfkp-crelu             = ["rshogi-core/edition-halfkp-crelu"]
edition-halfka_hm_merged-screlu  = ["rshogi-core/edition-halfka_hm_merged-screlu"]
edition-layerstacks-halfka_hm_merged-1536x16x32-none        = ["rshogi-core/edition-layerstacks-halfka_hm_merged-1536x16x32-none"]
edition-layerstacks-halfka_hm_merged-1536x16x32-psqt        = ["rshogi-core/edition-layerstacks-halfka_hm_merged-1536x16x32-psqt"]
edition-layerstacks-halfka_hm_merged-1536x16x32-threat      = ["rshogi-core/edition-layerstacks-halfka_hm_merged-1536x16x32-threat"]
edition-layerstacks-halfka_hm_merged-1536x16x32-psqt_threat = ["rshogi-core/edition-layerstacks-halfka_hm_merged-1536x16x32-psqt_threat"]
edition-layerstacks-halfka_hm_merged-1536x16x32-threat_symdedup = ["rshogi-core/edition-layerstacks-halfka_hm_merged-1536x16x32-threat_symdedup"]
edition-layerstacks-halfka_hm_merged-1536x32x32-none        = ["rshogi-core/edition-layerstacks-halfka_hm_merged-1536x32x32-none"]
edition-layerstacks-halfka_hm_merged-1024x16x32-none        = ["rshogi-core/edition-layerstacks-halfka_hm_merged-1024x16x32-none"]
edition-layerstacks-halfka_hm_merged-1024x16x32-threat      = ["rshogi-core/edition-layerstacks-halfka_hm_merged-1024x16x32-threat"]
edition-layerstacks-halfka_hm_merged-1024x16x32-threat_same_class            = ["rshogi-core/edition-layerstacks-halfka_hm_merged-1024x16x32-threat_same_class"]
edition-layerstacks-halfka_hm_merged-1024x16x32-threat_same_class_major_pawn = ["rshogi-core/edition-layerstacks-halfka_hm_merged-1024x16x32-threat_same_class_major_pawn"]
edition-layerstacks-halfka_hm_merged-1024x16x32-threat_step_attacker         = ["rshogi-core/edition-layerstacks-halfka_hm_merged-1024x16x32-threat_step_attacker"]
edition-layerstacks-halfka_hm_merged-768x16x32-none         = ["rshogi-core/edition-layerstacks-halfka_hm_merged-768x16x32-none"]
edition-layerstacks-halfka_hm_merged-768x16x32-threat       = ["rshogi-core/edition-layerstacks-halfka_hm_merged-768x16x32-threat"]
edition-layerstacks-halfka_hm_merged-768x8x32-none          = ["rshogi-core/edition-layerstacks-halfka_hm_merged-768x8x32-none"]
edition-layerstacks-halfka_hm_merged-512x16x32-none         = ["rshogi-core/edition-layerstacks-halfka_hm_merged-512x16x32-none"]
edition-layerstacks-halfka_hm_merged_effect_bucket-512x16x32-2x2_kingfixed       = ["rshogi-core/edition-layerstacks-halfka_hm_merged_effect_bucket-512x16x32-2x2_kingfixed"]
edition-layerstacks-halfka_hm_merged_effect_bucket-1024x16x32-2x2_kingfixed      = ["rshogi-core/edition-layerstacks-halfka_hm_merged_effect_bucket-1024x16x32-2x2_kingfixed"]
edition-layerstacks-halfka_hm_merged_effect_bucket-1024x16x32-3x3_kingfixed      = ["rshogi-core/edition-layerstacks-halfka_hm_merged_effect_bucket-1024x16x32-3x3_kingfixed"]
edition-layerstacks-halfka_hm_merged-3072x16x32-none        = ["rshogi-core/edition-layerstacks-halfka_hm_merged-3072x16x32-none"]
# LS specific preset (halfka_hm_merged 以外の 4 FT、1536x16x32-none で代表整備)。
edition-layerstacks-halfka_hm_split-1536x16x32-none = ["rshogi-core/edition-layerstacks-halfka_hm_split-1536x16x32-none"]
edition-layerstacks-halfka_merged-1536x16x32-none   = ["rshogi-core/edition-layerstacks-halfka_merged-1536x16x32-none"]
edition-layerstacks-halfka_split-1536x16x32-none    = ["rshogi-core/edition-layerstacks-halfka_split-1536x16x32-none"]
edition-layerstacks-halfkp-1536x16x32-none          = ["rshogi-core/edition-layerstacks-halfkp-1536x16x32-none"]

[[bin]]
name = "rshogi-usi"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.0"
serial_test = "3"
