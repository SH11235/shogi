[package]
name = "tools"
version = "0.1.0"
edition = "2024"
authors = ["SH11235"]
description = "Performance benchmarking and analysis tools for shogi engine"
license = "GPL-3.0-or-later"
repository = "https://github.com/SH11235/rshogi"

[features]
# default は解析対象 NNUE アーキテクチャ集合 (nnue-arch)、DL 教師リスコア用 ONNX
# (dlshogi-onnx)、棋譜プレイヤー TUI (kifu-player) から成る。ort は load-dynamic なので
# dlshogi-onnx を default にしても build 時に libonnxruntime は不要 (実行時 dlopen)。
# 分離しておくことで依存を外したビルド (`--no-default-features --features nnue-arch`) を
# 表現でき、CI もその構成 (ONNX 無効フォールバック経路) を lint できる。
default = ["nnue-arch", "dlshogi-onnx", "kifu-player"]

# 解析対象 NNUE アーキテクチャ (LayerStack L1 サイズ + FT variant 5 種) の既定集合。
nnue-arch = [
    "rshogi-core/layerstack-arch",
    "layerstacks-1536x16x32",
    "ft-halfkp",
    "ft-halfka_split",
    "ft-halfka_merged",
    "ft-halfka_hm_split",
    "ft-halfka_hm_merged",
]
# 診断ログ（EvalHashヒット率など）
diagnostics = ["rshogi-core/diagnostics"]
# Threat exclusion profiles
threat-profile-same-class = ["rshogi-core/threat-profile-same-class"]
threat-profile-same-class-major-pawn = ["rshogi-core/threat-profile-same-class-major-pawn"]
threat-profile-step-attacker = ["rshogi-core/threat-profile-step-attacker"]
threat-profile-full-symdedup = ["rshogi-core/threat-profile-full-symdedup"]
threat-profile-cross-side = ["rshogi-core/threat-profile-cross-side"]

# === Edition 軸 atomic feature 群 (本 crate で必要なものだけ forward) ===
# 設計は docs/decisions/2026-05-24-build-edition-flavor-design.md を参照。
# tools は静的 LS network の内部を解析するため、nnue-arch から layerstack-arch と
# size / FT slot を明示的に forward する。rshogi-core の default universal には依存しない。
# LS L1 サイズ slot
layerstacks-1536x16x32 = ["rshogi-core/layerstacks-1536x16x32"]
layerstacks-1536x32x32 = ["rshogi-core/layerstacks-1536x32x32"]
layerstacks-768x16x32  = ["rshogi-core/layerstacks-768x16x32"]
layerstacks-768x8x32   = ["rshogi-core/layerstacks-768x8x32"]
layerstacks-512x16x32  = ["rshogi-core/layerstacks-512x16x32"]
layerstacks-1024x16x32 = ["rshogi-core/layerstacks-1024x16x32"]
layerstacks-3072x16x32 = ["rshogi-core/layerstacks-3072x16x32"]
# LS 拡張 slot
nnue-psqt   = ["rshogi-core/nnue-psqt"]
nnue-threat = ["rshogi-core/nnue-threat"]
nnue-effect-bucket = ["rshogi-core/nnue-effect-bucket"]
effect-bucket-2x2-kingfixed = ["rshogi-core/effect-bucket-2x2-kingfixed"]
effect-bucket-2x2-kingbucketed = ["rshogi-core/effect-bucket-2x2-kingbucketed"]
effect-bucket-3x3-kingfixed = ["rshogi-core/effect-bucket-3x3-kingfixed"]
effect-bucket-3x3-kingbucketed = ["rshogi-core/effect-bucket-3x3-kingbucketed"]
# FT slot (LS の Feature Transformer 軸、5 variants)
ft-halfkp           = ["rshogi-core/ft-halfkp"]
ft-halfka_split     = ["rshogi-core/ft-halfka_split"]
ft-halfka_merged    = ["rshogi-core/ft-halfka_merged"]
ft-halfka_hm_split  = ["rshogi-core/ft-halfka_hm_split"]
ft-halfka_hm_merged = ["rshogi-core/ft-halfka_hm_merged"]

# AobaZero ONNX直接推論（ONNX Runtime + CUDA が必要）
aobazero-onnx = ["dep:ort", "dep:ndarray"]
# 標準dlshogi ONNX直接推論（DL水匠等、ONNX Runtime + CUDA が必要）
dlshogi-onnx = ["dep:ort", "dep:ndarray"]

# 棋譜 replay（CSA/PSV/JSONL の parse・盤面再生・勝敗導出。`replay` モジュールの
# TUI を除く部分）。教師・評価系ツールが TUI 依存 (ratatui/crossterm) なしで
# 棋譜 replay を使うための軸。
csa-replay = []

# 棋譜プレイヤー TUI（PSV / tournament JSONL 共通の対局再生ビューア）。
# default に含める: 素の `cargo build --release` で kifu_player だけ旧版のまま
# 取り残されるのを防ぐ (required-features 付き bin は feature 無しだとビルド対象外)。
# TUI 依存 (ratatui/crossterm) を持ち込みたくない学習パイプライン等は
# `--no-default-features` でオプトアウトする。
kifu-player = ["csa-replay", "dep:ratatui", "dep:crossterm"]

[[bin]]
name = "kifu_player"
path = "src/bin/kifu_player.rs"
required-features = ["kifu-player"]

# eval_sfens は LayerStacks NNUE 前提のため nnue-arch に gate する。
[[bin]]
name = "eval_sfens"
path = "src/bin/eval_sfens.rs"
required-features = ["nnue-arch"]

# nnue_saturation は LayerStacks NNUE 前提のため nnue-arch に gate する。
[[bin]]
name = "nnue_saturation"
path = "src/bin/nnue_saturation.rs"
required-features = ["nnue-arch"]

# ek_testset は CSA replay に依存する（TUI は不要）ため csa-replay に gate する。
[[bin]]
name = "ek_testset"
path = "src/bin/ek_testset.rs"
required-features = ["csa-replay"]

# nyugyoku_metrics は CSA replay に依存する（TUI は不要）ため csa-replay に gate する。
[[bin]]
name = "nyugyoku_metrics"
path = "src/bin/nyugyoku_metrics.rs"
required-features = ["csa-replay"]

[dependencies]
# Workspace dependencies
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
flate2.workspace = true
env_logger.workspace = true
log.workspace = true

# Local dependencies
rshogi-core = { path = "../rshogi-core", default-features = false }
rshogi-csa = { path = "../rshogi-csa" }
# 定跡リーダ(book_from_csa の roundtrip テストで生成 .db を読み戻すのに使う)。
# edition(NNUE)軸には触れないため default-features=false とし、rshogi-core の feature は
# 本 crate 側の指定に委ねる(rshogi-usi と同じ方針)。
rshogi-book = { path = "../rshogi-book", default-features = false }
# csa_client と同一の TOML (CsaClientConfig) を floodgate_record が読むための依存。
# 設定型の再利用のみで transport / CLI は使わないため、default-features=false で
# tungstenite / rustls / clap 系依存を切り落とす。
rshogi-csa-client = { path = "../rshogi-csa-client", default-features = false }

# Additional dependencies
sysinfo = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "system-proxy"] }
walkdir = "2.5"
url = "2.5"
rayon = "1.10"
crossbeam-channel = "0.5"
ctrlc = "3.4"
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }
indicatif = "0.18"
rand = "0.9.3"
rand_chacha = "0.9"
rand_distr = "0.5"
byteorder = "1.5"
tempfile = "3.20"
glob = "0.3"
regex.workspace = true
toml.workspace = true
sha2 = "0.10"

# AobaZero ONNX direct inference (optional, behind "aobazero-onnx" feature)
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["load-dynamic", "api-24"] }
ndarray = { version = "0.16", optional = true }

# 棋譜プレイヤー TUI (optional, behind "kifu-player" feature)
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.28", optional = true }
